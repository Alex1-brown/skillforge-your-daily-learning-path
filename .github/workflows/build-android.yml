name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Prepare Capacitor web directory
        shell: bash
        run: |
          set -e
          rm -rf dist/client
          mkdir -p dist/client

          if [ -d ".output/public" ]; then
            cp -R .output/public/. dist/client/
          elif [ -d "dist" ]; then
            cp -R dist/. dist/client/ 2>/dev/null || true
          else
            echo "No web build directory found"
            exit 1
          fi

          # TanStack Start's production build does not emit a static index.html.
          # Capacitor requires one, so create a minimal client entry page from
          # the generated browser bundle.
          if [ ! -f "dist/client/index.html" ]; then
            entry=$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' | head -n 1)
            if [ -z "$entry" ]; then
              echo "Could not find the generated client entry bundle"
              find dist/client -maxdepth 2 -type f | sort | head -n 100
              exit 1
            fi
            entry="${entry#dist/client/}"
            cat > dist/client/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>SkillForge</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/$entry"></script>
            </body>
          </html>
          EOF
          fi

          test -s dist/client/index.html
          echo "Capacitor web directory:"
          ls -la dist/client
          echo "Entry:"
          grep -n "script type" dist/client/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skillforge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
